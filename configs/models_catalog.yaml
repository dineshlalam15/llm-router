# Market LLM Catalog
# Comprehensive catalog of modern LLM models with capabilities, pricing, latency,
# max context, and suitable task descriptions.

models:
  - id: "claude-3-5-sonnet"
    name: "Claude 3.5 Sonnet"
    provider: "claude"
    company: "Anthropic"
    pricing:
      input_per_million: 3.00
      output_per_million: 15.00
      tier: "premium"
    latency:
      tier: "moderate"
      typical_ms: 750
    context:
      max_input_tokens: 200000
      max_output_tokens: 8192
    multimodal: true
    suitable_tasks: "Complex multi-step reasoning, architectural system design, advanced code generation, deep strategy, nuanced creative and corporate copywriting, complex long-document synthesis"
    strengths:
      - "deep_strategy"
      - "advanced_coding"
      - "long_context_analysis"
